<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Title suffix</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0b5fff;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d21;
        --fg: #e6e8eb;
        --muted: #9aa1ab;
        --border: #3a3f47;
        --accent: #4c8dff;
        --accent-fg: #0b0d10;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .preview { margin: 12px 0 0; padding: 8px 10px; border: 1px dashed var(--border); border-radius: 6px; font-size: 12px; word-break: break-word; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    button {
      padding: 7px 14px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #status { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <label for="suffix">Title suffix</label>
  <input id="suffix" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. name@example.com">
  <p class="hint">Added after a “ | ” separator. Leave empty to turn the suffix off.</p>
  <p class="preview" id="preview"></p>
  <div class="row">
    <button id="save" type="button">Save</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
